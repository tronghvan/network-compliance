name: Build and Deploy Compliance Checker

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/network-compliance:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Debug - xem cau truc thu muc that
        run: |
          echo "Dang dung o thu muc:"
          pwd
          echo "Noi dung thu muc hien tai:"
          ls -la
          echo "Tim file Chart.yaml o dau:"
          find / -name "Chart.yaml" 2>/dev/null

      - name: Helm upgrade to new image
        run: |
          helm upgrade compliance-dev ./network-compliance-chart \
            --set image.tag=latest \
            --reuse-values
          kubectl rollout status cronjob/compliance-dev-network-compliance-chart 2>/dev/null || echo "CronJob khong ho tro rollout status, kiem tra thu cong"
